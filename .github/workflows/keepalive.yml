name: Supabase Keep-Alive

on:
  schedule:
    - cron: '23 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait a random amount of time
        if: github.event_name == 'schedule'
        run: |
          DELAY=$((RANDOM % 18001))
          echo "Sleeping for $DELAY seconds (about $((DELAY / 60)) minutes) before the heartbeat..."
          sleep $DELAY
      - name: Write heartbeat row
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{}')
          echo "Response from Supabase:"
          echo "$response"
          status=$(echo "$response" | grep -o 'HTTP_STATUS:[0-9]*' | cut -d: -f2)
          if [ "$status" != "201" ]; then
            echo "Heartbeat failed with status $status"
            exit 1
          fi
